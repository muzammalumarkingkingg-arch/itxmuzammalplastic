<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ITX MUZAMMAL PLASTIC</title>
  <style>
    :root{
      --bg:#050505;
      --panel:#101010;
      --panel-2:#181818;
      --gold:#d4af37;
      --gold-light:#f9e498;
      --text:#f4edd5;
      --muted:#bcae81;
      --green:#25d366;
      --shadow:0 14px 28px rgba(0,0,0,0.42);
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      background:
        radial-gradient(circle at 15% 15%, rgba(212,175,55,0.12), transparent 20%),
        radial-gradient(circle at 80% 0%, rgba(212,175,55,0.08), transparent 25%),
        var(--bg);
      color:var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height:1.5;
    }

    a{text-decoration:none}
    img{max-width:100%;display:block}

    .wrapper{
      max-width:1200px;
      margin:18px auto;
      border:2px solid var(--gold);
      background:rgba(16,16,16,0.98);
      box-shadow:var(--shadow);
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
      padding:16px 22px;
      background:#0a0a0a;
      border-bottom:1px solid var(--gold);
      position:sticky;
      top:0;
      z-index:99;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
    }

    .logo{
      width:60px;height:60px;border-radius:50%;
      border:2px solid var(--gold);
      overflow:hidden;
      background:#000;
      display:grid;place-items:center;
      box-shadow:0 0 12px rgba(212,175,55,0.22);
    }

    .logo img{
      width:100%;height:100%;object-fit:cover;
    }

    .brand-text{
      line-height:1.2;
    }

    .brand-text h2{
      font-size:13px;
      letter-spacing:1px;
      color:var(--gold-light);
      text-transform:uppercase;
      white-space:nowrap;
    }

    .brand-text small{
      font-size:10px;
      letter-spacing:1px;
      color:var(--muted);
      text-transform:uppercase;
    }

    .nav{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:12px;
    }

    .nav a{
      color:var(--text);
      font-size:13px;
      padding:8px 10px;
      border-radius:999px;
      transition:0.2s ease;
      cursor:pointer;
    }

    .nav a:hover{
      background:rgba(212,175,55,0.10);
      color:var(--gold-light);
    }

    .order-btn{
      background:linear-gradient(135deg, var(--gold-light), var(--gold));
      color:#111;
      font-weight:800;
      font-size:12px;
      border-radius:999px;
      padding:10px 18px;
      box-shadow:0 8px 18px rgba(212,175,55,0.25);
      white-space:nowrap;
    }

    .hero{
      padding:36px 18px 18px;
      text-align:center;
      background:
        linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
        url('https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?auto=format&fit=crop&w=1400&q=80') center/cover no-repeat;
      border-bottom:1px solid rgba(212,175,55,0.5);
    }

    .hero h1{
      font-size:clamp(28px,5vw,52px);
      letter-spacing:1px;
      color:var(--gold-light);
      margin-bottom:8px;
      text-transform:uppercase;
    }

    .hero .city{
      color:#ddd2b4;
      font-size:13px;
      letter-spacing:2px;
      text-transform:uppercase;
      margin-bottom:12px;
    }

    .hero .owner{
      color:var(--gold);
      font-weight:700;
      font-size:16px;
      margin-bottom:18px;
    }

    .search-wrap{
      max-width:540px;
      margin:0 auto;
      position:relative;
    }

    .search-wrap input{
      width:100%;
      background:#111;
      border:1px solid var(--gold);
      border-radius:30px;
      padding:16px 18px 16px 52px;
      color:#fff;
      font-size:15px;
      outline:none;
      box-shadow:inset 0 0 0 1px rgba(212,175,55,0.12);
    }

    .search-wrap input::placeholder{
      color:#8b8a84;
    }

    .search-icon{
      position:absolute;
      left:18px; top:50%;
      transform:translateY(-50%);
      color:var(--gold);
      font-size:18px;
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(4, minmax(120px,1fr));
      gap:12px;
      padding:18px;
    }

    .stat{
      background:linear-gradient(180deg, rgba(25,25,25,0.9), rgba(12,12,12,1));
      border:1px solid rgba(212,175,55,0.22);
      border-radius:14px;
      padding:18px 12px;
      text-align:center;
      box-shadow:0 10px 20px rgba(0,0,0,0.18);
    }

    .stat .num{
      color:var(--gold-light);
      font-size:28px;
      font-weight:800;
      margin-bottom:4px;
    }

    .stat .label{
      color:var(--muted);
      font-size:11px;
      letter-spacing:1px;
      text-transform:uppercase;
    }

    .section{
      padding:20px 18px 10px;
    }

      align-items:center;
      justify-content:space-between;
